# screen-like
unbind C-b
set-option -g prefix C-a
bind C-a last-window
bind a send-prefix

# Window numbering starts at 1; panes too, and renumber on close (no gaps)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Let modified keys (e.g. Shift+Enter in Claude Code) pass through tmux.
# extended-keys/extkeys are negotiated at client-attach time, so having these
# set before attach (i.e. in this file) makes Shift+Enter work without a manual
# detach/re-attach.
set -g allow-passthrough on
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

run 'tpack init'
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "sainnhe/tmux-fzf"
set -g @plugin "yardnsm/tmux-1password"
